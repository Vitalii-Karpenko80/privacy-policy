<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0}
    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:#F4F3F0;color:#17171C;
      font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column}
    .pad{padding:0 20px}
    .card{background:#fff;border:1px solid #EFEEEA;border-radius:22px;
      box-shadow:0 1px 2px rgba(20,20,32,.05),0 12px 30px rgba(20,20,32,.05)}
    .chip{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .time{width:46px;font-size:14px;font-weight:600;color:#9A9AA1;font-variant-numeric:tabular-nums;flex-shrink:0}
    .row{display:flex;align-items:center;gap:13px;padding:13px 16px}
    .hair{height:1px;background:#F0EFEB;margin:0 16px}
    a{color:#5B54E6}a:hover{color:#463FCC}
  </style>
</helmet>
<div class="screen">
  <!-- safe area (no fake status bar) -->
  <div style="height:56px"></div>

  <!-- header -->
  <div class="pad" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
    <div>
      <div style="font-size:12px;font-weight:700;letter-spacing:.16em;color:#5B54E6">VOICEFLOW</div>
      <div style="font-size:15px;color:#8B8B93;margin-top:3px">Суббота, 6 сентября</div>
    </div>
    <div style="width:40px;height:40px;border-radius:50%;background:#ECEBFB;display:flex;align-items:center;justify-content:center;color:#5B54E6;font-weight:700;font-size:15px">В</div>
  </div>

  <!-- Today -->
  <div class="pad" style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
    <div style="font-size:26px;font-weight:700;letter-spacing:-.02em">Сегодня</div>
    <div style="font-size:14px;color:#9A9AA1">2 события · 2 задачи</div>
  </div>

  <div class="pad">
    <div class="card" style="padding:4px 0">
      <div class="row">
        <div class="time">09:30</div>
        <div class="chip" style="background:#E1F4EC;color:#12A574">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.2l2.4 2.4 4.6-5.2"/></svg>
        </div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">Позвонить Сергею</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFCFD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="hair"></div>
      <div class="row">
        <div class="time">11:00</div>
        <div class="chip" style="background:#E7EEFF;color:#2F6BFF">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 9.5h17"/><path d="M8 3v3"/><path d="M16 3v3"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:600">Объект — Химки</div>
          <div style="font-size:13px;color:#9A9AA1;margin-top:1px">Выезд · с Андреем</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFCFD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="hair"></div>
      <div class="row">
        <div class="time">14:30</div>
        <div class="chip" style="background:#E1F4EC;color:#12A574">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.2l2.4 2.4 4.6-5.2"/></svg>
        </div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">Проверить счёт</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFCFD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="hair"></div>
      <div class="row">
        <div class="time">16:00</div>
        <div class="chip" style="background:#E7EEFF;color:#2F6BFF">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 9.5h17"/><path d="M8 3v3"/><path d="M16 3v3"/></svg>
        </div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">Стоматолог</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFCFD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <!-- recent -->
  <div class="pad" style="margin-top:16px">
    <div style="font-size:13px;font-weight:600;color:#9A9AA1;margin:0 4px 8px">Недавняя команда</div>
    <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;color:#3A3A42;line-height:1.35">«В пятницу встреча с&nbsp;Сергеем…»</div>
        <div style="font-size:12.5px;color:#9A9AA1;margin-top:6px">📅 1 событие&nbsp;·&nbsp;✓ 1 задача&nbsp;·&nbsp;👤 Сергей</div>
      </div>
      <div style="font-size:12.5px;color:#B4B4BB;flex-shrink:0">09:42</div>
    </div>
  </div>

  <!-- mic dock -->
  <div style="margin-top:auto;padding:0 20px 30px;display:flex;flex-direction:column;align-items:center">
    <div style="position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;margin-bottom:14px">
      <div style="position:absolute;inset:0;border-radius:50%;background:#ECEBFB"></div>
      <div style="position:absolute;inset:9px;border-radius:50%;background:#DEDBFA"></div>
      <div style="position:relative;width:106px;height:106px;border-radius:50%;background:linear-gradient(155deg,#6B63F0,#938DFF);
        display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(91,84,230,.42)">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4"/><path d="M9 21h6"/></svg>
      </div>
    </div>
    <div style="font-size:19px;font-weight:600;letter-spacing:-.01em">Что нужно запомнить?</div>
    <div style="font-size:14px;color:#9A9AA1;margin-top:4px">Нажмите и говорите</div>
  </div>
</div>
</x-dc>
</body>
</html>
