<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0}
    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:#0C0C11;color:#F5F5F7;
      font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column}
    .wave{display:flex;align-items:center;justify-content:center;gap:5px;height:64px}
    .wave i{width:5px;border-radius:3px;background:linear-gradient(180deg,#9E98FF,#6B63F0);display:block;
      animation:vf 1.1s ease-in-out infinite}
    @keyframes vf{0%,100%{height:12px;opacity:.55}50%{height:46px;opacity:1}}
    a{color:#9E98FF}a:hover{color:#B7B2FF}
  </style>
</helmet>
<div class="screen">
  <div style="height:60px"></div>

  <!-- listening pill -->
  <div style="display:flex;justify-content:center;margin-bottom:34px">
    <div style="display:flex;align-items:center;gap:9px;background:#17171F;border:1px solid #23232E;padding:8px 16px;border-radius:999px">
      <span style="width:9px;height:9px;border-radius:50%;background:#FF5C5C;box-shadow:0 0 0 4px rgba(255,92,92,.16)"></span>
      <span style="font-size:14px;font-weight:600;color:#EDEDF2">Слушаю…</span>
    </div>
  </div>

  <!-- live transcript -->
  <div style="padding:0 26px">
    <div style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#605F6B;margin-bottom:14px">РАСШИФРОВКА</div>
    <div style="font-size:23px;line-height:1.42;font-weight:500;letter-spacing:-.01em">
      В пятницу в два часа встреча с Сергеем по вентиляции, напомни за час
      <span style="color:#66656F"> и надо до встречи проверить его коммерческое</span><span style="display:inline-block;width:2px;height:22px;background:#9E98FF;vertical-align:-3px;margin-left:2px"></span>
    </div>
  </div>

  <!-- waveform -->
  <div style="margin-top:auto">
    <div class="wave">
      <i style="animation-delay:0s"></i><i style="animation-delay:.09s"></i><i style="animation-delay:.18s"></i>
      <i style="animation-delay:.27s"></i><i style="animation-delay:.36s"></i><i style="animation-delay:.45s"></i>
      <i style="animation-delay:.54s"></i><i style="animation-delay:.42s"></i><i style="animation-delay:.30s"></i>
      <i style="animation-delay:.20s"></i><i style="animation-delay:.12s"></i><i style="animation-delay:.24s"></i>
      <i style="animation-delay:.33s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.06s"></i>
      <i style="animation-delay:.21s"></i><i style="animation-delay:.39s"></i><i style="animation-delay:.48s"></i>
    </div>
  </div>

  <!-- stop -->
  <div style="padding:26px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="width:72px;height:72px;border-radius:50%;background:#17171F;border:1px solid #2A2A36;display:flex;align-items:center;justify-content:center">
      <div style="width:26px;height:26px;border-radius:7px;background:#FF5C5C"></div>
    </div>
    <div style="font-size:14px;color:#8B8A96">Коснитесь, чтобы завершить</div>
  </div>
</div>
</x-dc>
</body>
</html>
