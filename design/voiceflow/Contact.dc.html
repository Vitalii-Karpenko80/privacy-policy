<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box}
    body{margin:0}
    .screen{width:390px;height:844px;position:relative;overflow:hidden;background:#F4F3F0;color:#17171C;
      font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column}
    .card{background:#fff;border:1px solid #EFEEEA;border-radius:20px;
      box-shadow:0 1px 2px rgba(20,20,32,.05),0 10px 24px rgba(20,20,32,.045)}
    .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;color:#9A9AA1;margin:0 4px 9px}
    .hair{height:1px;background:#F0EFEB;margin:0 16px}
    a{color:#5B54E6}a:hover{color:#463FCC}
  </style>
</helmet>
<div class="screen">
  <div style="height:54px"></div>

  <!-- nav -->
  <div style="padding:0 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A3A42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div style="font-size:17px;font-weight:600">Контакт</div>
    <div style="width:24px"></div>
  </div>

  <!-- profile -->
  <div style="display:flex;flex-direction:column;align-items:center;padding:0 24px">
    <div style="width:76px;height:76px;border-radius:50%;background:linear-gradient(155deg,#B06AE6,#8A3FD1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;box-shadow:0 12px 26px rgba(139,63,209,.28)">СИ</div>
    <div style="font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:14px">Сергей Иванов</div>
    <div style="font-size:14px;color:#8B8B93;margin-top:3px">Вентиляция · подрядчик</div>
    <div style="display:flex;gap:12px;margin-top:18px">
      <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #EFEEEA;border-radius:13px;padding:10px 18px;font-size:15px;font-weight:600;color:#12A574">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A15 15 0 0 1 4.5 6a2 2 0 0 1 2-2z"/></svg>Позвонить
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #EFEEEA;border-radius:13px;padding:10px 18px;font-size:15px;font-weight:600;color:#2F6BFF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3V6a1 1 0 0 1 1-1z"/></svg>Написать
      </div>
    </div>
  </div>

  <!-- timeline stats -->
  <div style="padding:26px 20px 0">
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9AA1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <div style="flex:1;font-size:15px;color:#3A3A42">Последний контакт</div>
        <div style="font-size:15px;font-weight:600">2 сентября</div>
      </div>
      <div class="hair"></div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 9.5h17"/><path d="M8 3v3"/><path d="M16 3v3"/></svg>
        <div style="flex:1;font-size:15px;color:#3A3A42">Следующая встреча</div>
        <div style="font-size:15px;font-weight:600;color:#2F6BFF">11 сент · 14:00</div>
      </div>
    </div>
  </div>

  <!-- open tasks -->
  <div style="padding:22px 20px 0">
    <div class="lbl">ОТКРЫТЫЕ ЗАДАЧИ</div>
    <div class="card" style="padding:4px 0">
      <div style="display:flex;align-items:center;gap:12px;padding:13px 16px">
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid #12A574;flex-shrink:0"></span>
        <div style="flex:1;font-size:15.5px;font-weight:600">Отправить КП</div>
      </div>
      <div class="hair"></div>
      <div style="display:flex;align-items:center;gap:12px;padding:13px 16px">
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid #12A574;flex-shrink:0"></span>
        <div style="flex:1;font-size:15.5px;font-weight:600">Проверить вентиляцию</div>
      </div>
    </div>
  </div>

  <!-- last note -->
  <div style="padding:22px 20px 0">
    <div class="lbl">ПОСЛЕДНЯЯ ЗАМЕТКА</div>
    <div class="card" style="padding:15px 16px;display:flex;gap:12px;align-items:flex-start">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E0912B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M6 3.5h9l3.5 3.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14.5 3.5V7.5H18"/><path d="M8.5 12.5h7"/><path d="M8.5 16h4.5"/></svg>
      <div style="font-size:15px;color:#3A3A42;line-height:1.4">Ждёт стоимость оборудования перед подтверждением сроков поставки.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
